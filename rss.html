<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RSS Feeds</title>

<style>

body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
}

.container {
    display: table;
    width: 100%;
    border-spacing: 0;
}

.feed {
    display: table-cell;
    width: 25%;
    vertical-align: top;
    padding: 0;

    border-left: 4px solid #f3efe6;
}

.feed:first-child {
    border-left: 4px solid #f3efe6;
}

.feed:last-child {
    border-right: 4px solid #f3efe6;
}

.feed-title {
    padding: 20px 0 15px 0;
    background-color: #d8d0c3;
    color: #72603f;
    text-align: center;
    font-size: 12px;
    font-weight: bold;

    border-top: 4px solid #f3efe6;
    border-bottom: 2px solid #f3efe6;
}

.feedEkList {
    width: 100%;
    height: 600px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 6px;
    background-color: #fffbf0;
    color: #505659;
    box-sizing: border-box;
}

.itemDate {
    font-size: 11px;
    color: #aaa;
    padding-top: 2px;
}

.itemTitle {
    padding: 5px;
    border-bottom: 1px dashed #D3CAD7;
    line-height: 1.3;
}

.itemTitle:last-child {
    border-bottom: none;
}

.itemTitle a {
    color: #505659 !important;
    text-decoration: none;
}

.itemTitle a:hover {
    text-decoration: underline;
}
    
#rss-1 .itemTitle {
    padding: 5px 5px 15px 5px;
}

</style>

<script>

function loadFeed(jsonFile, targetId) {

    fetch(jsonFile)
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(item => {

                html += '<div class="itemTitle">';
                html += `<a href="${item.link}" target="_blank">${item.title}</a>`;

                if (item.pubDate) {

                    const d = new Date(item.pubDate);

                    const datum =
                        String(d.getDate()).padStart(2, '0') + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        d.getFullYear() + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' +
                        String(d.getMinutes()).padStart(2, '0');

                    html += `<div class="itemDate">${datum}</div>`;
                }

                html += '</div>';

            });

            document.getElementById(targetId).innerHTML = html;

        })
        .catch(error => {

            document.getElementById(targetId).innerHTML =
                '<span style="color:red">Feed laden mislukt</span>';

            console.error(error);

        });
}

window.onload = function() {

    loadFeed(
        'feeds/computerbase.json',
        'rss-1'
    );

    loadFeed(
        'feeds/ninite.json',
        'rss-2'
    );

    loadFeed(
        'feeds/pfc.json',
        'rss-3'
    );

    loadFeed(
        'feeds/portableapps.json',
        'rss-4'
    );

};

</script>

</head>

<body>

<div class="container">

    <div class="feed">
        <div class="feed-title">ComputerBase</div>
        <div id="rss-1" class="feedEkList">Laden...</div>
    </div>

    <div class="feed">
        <div class="feed-title">Ninite Updates</div>
        <div id="rss-2" class="feedEkList">Laden...</div>
    </div>

    <div class="feed">
        <div class="feed-title">Portable Freeware Collection</div>
        <div id="rss-3" class="feedEkList">Laden...</div>
    </div>

    <div class="feed">
        <div class="feed-title">PortableApps.com</div>
        <div id="rss-4" class="feedEkList">Laden...</div>
    </div>

</div>

</body>
</html>
