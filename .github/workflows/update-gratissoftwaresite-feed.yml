name: Update GratisSoftwareSite Feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Generate feed
        run: php scripts/gratissoftwaresite.php

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add feeds/gratissoftwaresite.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update GratisSoftwareSite feed"
          git push
