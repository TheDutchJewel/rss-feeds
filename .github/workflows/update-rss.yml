name: Update RSS Feeds

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

jobs:
  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Update feeds
        run: node update-feeds.js

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git add feeds/*.json

          git diff --staged --quiet || git commit -m "Update RSS feeds"

          git push
